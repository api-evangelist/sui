name: Sui
description: 'Sui is a next-generation Move-based blockchain developed by Mysten Labs,
  designed for high throughput, low latency, and an asset-oriented programming model.
  It provides gRPC, GraphQL, and legacy JSON-RPC interfaces for querying objects,
  transactions, checkpoints, events, and balances on the Sui network. The gRPC API
  is the current recommended interface, replacing the deprecated JSON-RPC, while GraphQL
  RPC offers flexible reads for frontends and dashboards.

  '
