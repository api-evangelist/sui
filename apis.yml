apis:
- name: Sui GraphQL RPC
  description: >
    A generally available RPC service for flexible reads, transaction submission, and simulation backed
    by the Sui General-Purpose Indexer, Consistent Store, full nodes, and Archival Service. Best suited
    for frontends, dashboards, and nested queries combining multiple data types. Supports queries for
    addresses, objects, transactions, checkpoints, events, epochs, and coin metadata.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.sui.io/references/sui-graphql
  baseURL: https://sui-mainnet.mystenlabs.com/graphql
