- name: Sui JSON-RPC API (Deprecated)
  description: >
    The legacy JSON-RPC API for interacting with Sui full nodes, providing methods for querying objects,
    transactions, checkpoints, events, balances, and coin metadata. This interface is deprecated and will
    be decommissioned on July 31, 2026. Developers should migrate to the gRPC or GraphQL RPC APIs. The
    public endpoint is rate-limited to 100 requests per 30 seconds.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.sui.io/sui-api-ref
  baseURL: https://fullnode.mainnet.sui.io:443
